<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>ChatGPT 15</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<header><button id="menuBtn" class="iconBtn" aria-label="Chats"><span class="hamb"><i></i><i></i><i></i></span></button><button id="modelBtn" class="modelBtn"><span id="modelLabel">GPT-5.6 Luna</span><span class="chev">⌄</span></button><button id="settingsBtn" class="iconBtn" aria-label="Settings">⚙</button></header>
<main id="messages"><section id="welcome" class="welcome"><div class="orb">✦</div><h1>What can I help with?</h1><p>ChatGPT for iOS 15</p></section></main>
<div id="attachPreview" class="attachPreview hidden"></div>
<footer><div class="composer"><button id="attachBtn" class="attachBtn" aria-label="Attach image">＋</button><textarea id="prompt" rows="1" placeholder="Message ChatGPT" enterkeyhint="send"></textarea><button id="sendBtn" class="sendBtn" aria-label="Send"><span class="sendArrow"></span></button></div><div id="usageLine" class="usageLine">AI can make mistakes.</div></footer>
</div>

<div id="drawerOverlay" class="overlay hidden"><aside id="drawer"><div class="drawerHead"><h2>Chats</h2><button id="drawerClose" class="roundBtn">×</button></div><button id="newChatBtn" class="primary">＋ New chat</button><button id="projectsBtn" class="secondary">▣ Projects</button><input id="chatSearch" class="field" type="search" placeholder="Search chats"><div id="chatList"></div></aside></div>

<div id="settingsOverlay" class="overlay hidden"><section id="settingsSheet" class="sheet"><div class="handle"></div><div class="drawerHead"><h2>Settings</h2><button id="settingsClose" class="roundBtn">×</button></div><label>OpenAI API key</label><div class="keyRow"><input id="apiKey" class="field" type="password" placeholder="sk-..." autocomplete="off"><button id="keyReveal" class="miniBtn">Show</button></div><label>Model</label><select id="modelSelect" class="field"><option value="gpt-5.6-luna">GPT-5.6 Luna</option><option value="gpt-5.6-terra">GPT-5.6 Terra</option><option value="gpt-5.6-sol">GPT-5.6 Sol</option></select><label>Custom instructions</label><textarea id="instructions" class="field settingsText" rows="4" placeholder="Optional instructions for every chat"></textarea><label class="toggleRow"><span>Show token usage</span><input id="usageToggle" type="checkbox"></label><button id="saveSettings" class="primary">Save settings</button><p class="note">Chats and your key are stored locally on this iPhone.</p></section></div>

<div id="projectsOverlay" class="overlay hidden"><section id="projectsSheet" class="sheet"><div class="handle"></div><div class="drawerHead"><h2>Projects</h2><button id="projectsClose" class="roundBtn">×</button></div><div class="projectCreate"><input id="projectName" class="field" placeholder="Project name"><button id="createProject" class="primary">Create</button></div><div id="projectActive" class="projectActive hidden"></div><div id="projectList"></div></section></div>
<div id="projectEditOverlay" class="overlay hidden"><section id="projectEditSheet" class="sheet"><div class="handle"></div><div class="drawerHead"><h2 id="projectEditTitle">Project</h2><button id="projectEditClose" class="roundBtn">×</button></div><label>Name</label><input id="projectEditName" class="field"><label>Project instructions</label><textarea id="projectEditInstructions" class="field settingsText" rows="5" placeholder="Instructions used for every chat in this project"></textarea><label>Reference notes</label><textarea id="projectEditNotes" class="field settingsText" rows="6" placeholder="Paste context, notes, requirements, or reference material"></textarea><button id="projectEditSave" class="primary">Save project</button><button id="projectNewChat" class="secondary">New chat in project</button><button id="projectDelete" class="dangerBtn">Delete project</button><div id="projectChats" class="projectChats"></div></section></div>
<div id="modelOverlay" class="overlay hidden"><section id="modelSheet" class="sheet smallSheet"><div class="handle"></div><h2>Choose model</h2><button class="modelChoice" data-model="gpt-5.6-luna"><b>GPT-5.6 Luna</b><span>Fastest</span></button><button class="modelChoice" data-model="gpt-5.6-terra"><b>GPT-5.6 Terra</b><span>Balanced</span></button><button class="modelChoice" data-model="gpt-5.6-sol"><b>GPT-5.6 Sol</b><span>Most capable</span></button></section></div>

<div id="msgMenuOverlay" class="overlay hidden"><section id="msgMenu" class="sheet smallSheet"><div class="handle"></div><button id="copyBtn" class="actionBtn">Copy response</button><button id="regenBtn" class="actionBtn">Regenerate</button><button id="shareBtn" class="actionBtn">Share</button><button id="imageGenBtn" class="actionBtn">Create image from this</button><button id="menuCancel" class="actionBtn muted">Cancel</button></section></div>
<input id="imagePicker" class="hidden" type="file" accept="image/*">
<script src="app.js"></script></body></html>
